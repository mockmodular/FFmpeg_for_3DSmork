name: Build FFmpeg for 3DS

on:
  push:
    branches: [3ds]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          sudo apt-get update
          sudo apt-get install -y gdebi-core wget
          wget https://github.com/devkitPro/pacman/releases/latest/download/devkitpro-pacman.amd64.deb
          sudo gdebi -n devkitpro-pacman.amd64.deb
          sudo dkp-pacman -Sy --noconfirm 3ds-dev

      - name: Install build deps
        run: |
          sudo apt-get install -y nasm build-essential pkg-config

      - name: Build x264
        run: |
          git clone https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure \
            --cross-prefix=/opt/devkitpro/devkitARM/bin/arm-none-eabi- \
            --prefix=/opt/devkitpro/extra_lib \
            --host=arm-none-eabi \
            --extra-cflags="-mfloat-abi=hard -mtune=mpcore -mtp=cp15 -I/opt/devkitpro/extra_lib/include" \
            --extra-ldflags="-mfloat-abi=hard -L/opt/devkitpro/extra_lib/lib -specs=3dsx.specs" \
            --enable-static --disable-shared --disable-opencl \
            --disable-cli --disable-asm
          make -j$(nproc)
          sudo make install

      - name: Build FFmpeg
        run: |
          git reset --hard 2a054b87a7bacf3bc55690f621cf56ed9cf1ba5d
          ./configure \
            --enable-cross-compile \
            --cross-prefix=/opt/devkitpro/devkitARM/bin/arm-none-eabi- \
            --prefix=/opt/devkitpro/extra_lib \
            --cpu=armv6k --arch=arm --target-os=linux \
            --extra-cflags="-mfloat-abi=hard -mtune=mpcore -mtp=cp15 -Wno-error=incompatible-pointer-types -I/opt/devkitpro/extra_lib/include" \
            --extra-ldflags="-mfloat-abi=hard -L/opt/devkitpro/extra_lib/lib -specs=3dsx.specs" \
            --extra-libs="-lctru" \
            --enable-optimizations \
            --disable-filters --disable-devices --disable-bsfs --disable-parsers \
            --disable-hwaccels --disable-debug --disable-stripping --disable-programs \
            --disable-avdevice --disable-postproc --disable-avfilter \
            --disable-decoders --disable-demuxers --disable-encoders --disable-muxers \
            --disable-asm --disable-protocols --disable-doc \
            --enable-inline-asm --enable-vfp --enable-armv5te --enable-armv6 \
            "--enable-decoder=aac,ac3,flac,h261,h262,h263,h264,hevc,jpeg,jpeg2000,libdav1d,theora,mjpeg,mp1,mp2,mp3,mpeg1video,mpeg2video,mpeg4,msmpeg4v2,msmpeg4v3,opus,pcm_s16le,pcm_s16be,pcm_u8,vorbis,vp9,webp,dvdsub,subrip,subviewer,movtext,rv10,rv20,rv30,rv40,ra_144,ra_288,cook,atrac3,sipr" \
            "--enable-demuxer=aac,ac3,avi,h261,h263,h264,hevc,matroska,m4v,mjpeg,mjpeg_2000,mpegvideo,mpjpeg,mp3,mov,ogg,vp8,vp9,wav,srt,subviewer,rm" \
            --enable-encoder=aac,ac3,mp2,mpeg4,mjpeg,mpeg2video \
            --enable-muxer=mp4,mp3,mp2,ac3 \
            --enable-protocol=file \
            --enable-libx264 --enable-libdav1d \
            --enable-gpl --enable-pthreads
          make -j$(nproc)
          sudo make install

      - name: Package artifacts
        run: |
          mkdir -p output/lib output/include
          cp /opt/devkitpro/extra_lib/lib/libav*.a output/lib/
          cp /opt/devkitpro/extra_lib/lib/libsw*.a output/lib/
          cp -r /opt/devkitpro/extra_lib/include/libav* output/include/
          cp -r /opt/devkitpro/extra_lib/include/libsw* output/include/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-3ds
          path: output/
          retention-days: 30
